name: SEO Check

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Start Next.js server in background
        run: |
          npx next start -p 3100 &
          ready=0
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3100 || true)
            if [ "$code" = "200" ] || [ "$code" = "307" ] || [ "$code" = "308" ]; then
              echo "Server is ready on port 3100!"
              ready=1
              break
            fi
            echo "Waiting for Next.js server... ($i/30)"
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Failed to start Next.js server on port 3100 within 30s"
            exit 1
          fi

      - name: Run unit & integration tests
        run: npm test

      - name: Verify PDF redaction irreversibility
        run: |
          pip install --break-system-packages pymupdf pdfplumber
          sudo apt-get update && sudo apt-get install -y poppler-utils
          python3 scripts/test-redaction.py

      - name: Run SEO validation
        run: npm run seo-check
        env:
          BASE_URL: http://localhost:3100
