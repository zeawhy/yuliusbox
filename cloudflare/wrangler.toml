name = "yuliusbox-ai"
main = "worker.js"
compatibility_date = "2024-09-23"

# Required by `npx wrangler preview` (the Workers Builds deploy command).
# The block may stay empty; it only enables preview deployments.
[previews]

# Observability
[observability]
enabled = true

# Rate limiting KV namespace (10 req/min per IP, see worker.js).
[[kv_namespaces]]
binding = "LIMITER"
id = "91cc27c541154d3fbe60dab6a6284c24"

# Workers AI binding (free 10k neurons/day, no API key needed).
[ai]
binding = "AI"
